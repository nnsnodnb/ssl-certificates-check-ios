name: Recompute Package.resolved originHash

on:
  pull_request:
    paths:
      - "SSLCertificateCheckPackage/Package.swift"
      - "SSLCertificateCheck.xcworkspace/xcshareddata/swiftpm/Package.resolved"

jobs:
  recompute:
    if: ${{ github.event.pull_request.user.login == 'renovate[bot]' }}
    runs-on: macos-26

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SCHEME: SSLCertificateCheck
      WORKSPACE: SSLCertificateCheck.xcworkspace
      PACKAGE_RESOLVED: SSLCertificateCheck.xcworkspace/xcshareddata/swiftpm/Package.resolved

    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Get SwiftPM originHash
        id: get-swiftpm-origin-hash
        run: |
          ORIGIN_HASH="$(jq -c -r '.originHash' "${PACKAGE_RESOLVED}")"
          echo "ORIGIN_HASH=${ORIGIN_HASH}" >> "${GITHUB_OUTPUT}"

      - name: Cache Swift Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-swiftpm
        timeout-minutes: 20
        with:
          path: .swiftpm
          key: ${{ runner.os }}-swiftpm-${{ steps.get-swiftpm-origin-hash.outputs.ORIGIN_HASH }}

      - name: Restore Package.resolved to its base
        run: |
          git fetch --no-tags origin "${GITHUB_BASE_REF}"
          git checkout "FETCH_HEAD" -- "${PACKAGE_RESOLVED}"

      - name: Recompute Package.resolved
        env:
          SCHEME: "${{ env.SCHEME }}Package"
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -scheme "${SCHEME}" \
            -workspace "${WORKSPACE}" \
            -clonedSourcePackagesDirPath .swiftpm

      - name: Git commit & push if needed
        run: |
          if [ -z "$(git status --porcelain "${PACKAGE_RESOLVED}")" ]; then
            echo "no change in ${PACKAGE_RESOLVED}; skipping commit/push"
            exit 0
          fi
          git add "${PACKAGE_RESOLVED}"
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: recompute Package.resolved originHash"
          git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
